[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers -p no:cacheprovider -m "not manual and not system and not slow"
markers =
    unit: Fast tests for small units of logic.
    component: Tests for a full module/class through its public contract.
    integration: Tests exercising multiple real components together.
    system: End-to-end system checks in a deployed/runtime-like setup.
    uat: User acceptance tests against user-facing requirements.
    regression: Tests that guard previously working behavior.
    slow: Long-running automated tests.
    manual: Non-automated or opt-in tests.
